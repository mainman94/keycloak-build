name: build

on:
  push:
    branches: [main]
    # Only what ends up in the image: the themes, and this workflow itself
    # (build options, builder pin, and with it the Keycloak version).
    # Lint, docs and tooling changes do not publish a new image.
    paths:
      - themes/**
      - .github/workflows/build.yml
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  keycloak:
    name: keycloak
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signing, no key to store
    steps:
      # Optimized image for the homelab Keycloak Operator CR
      # (multi-k8s-infra, eggenberg-talos-cluster-1): PostgreSQL, health and
      # metrics are baked in; amd64 matches the Talos nodes. Pull requests only
      # build, pushes to main publish ghcr.io/mainman94/keycloak:<sha>.
      # Checkout only feeds themes/ into the build; the action ships its own
      # Dockerfile.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build Keycloak image
        id: keycloak
        uses: FullStackS-GmbH/keycloak-image-builder@74e16713cec1fd2b47ec143b82172b2f31efe010 # main
        with:
          image-name: ghcr.io/${{ github.repository_owner }}/keycloak
          image-tag: ${{ github.sha }}
          db: postgres
          health-enabled: 'true'
          metrics-enabled: 'true'
          platforms: linux/amd64
          themes-path: themes
          push: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}

      - name: Install cosign and trivy
        if: steps.keycloak.outputs.digest != ''
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5
        with:
          install_args: cosign trivy

      - name: Log in to GHCR
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Advisory: scans the pushed image by digest. Fixed CRITICAL/HIGH
      # findings show as a failed step without blocking the publish.
      - name: Scan image with trivy
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          IMAGE: ${{ steps.keycloak.outputs.image }}
          DIGEST: ${{ steps.keycloak.outputs.digest }}
        run: trivy image --ignore-unfixed --severity CRITICAL,HIGH --scanners vuln "${IMAGE}@${DIGEST}"

      # Signed by digest, keylessly: the signature carries this workflow's
      # OIDC identity and lands in Rekor.
      - name: Sign the pushed image
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          IMAGE: ${{ steps.keycloak.outputs.image }}
          DIGEST: ${{ steps.keycloak.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Summary
        env:
          IMAGE: ${{ steps.keycloak.outputs.image }}
          DIGEST: ${{ steps.keycloak.outputs.digest }}
          BASE_IMAGE: ${{ steps.keycloak.outputs.base-image }}
        run: |-
          # shellcheck disable=SC2016 # backticks are literal Markdown
          printf '### Result\n\n| | |\n|---|---|\n| Image | `%s` |\n| Digest | `%s` |\n| Base | `%s` |\n' \
            "$IMAGE" "$DIGEST" "$BASE_IMAGE" >> "$GITHUB_STEP_SUMMARY"
