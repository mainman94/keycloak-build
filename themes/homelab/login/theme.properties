# Homelab login theme: keycloak.v2 (PatternFly 5) with a homelab look.
# Templates, messages and scripts come from the parent; this theme only adds
# one stylesheet and a logo, so Keycloak updates keep working unchanged.
# The parent's css/styles.css is listed first and still resolves from
# keycloak.v2, because this theme ships no file under that name.
parent=keycloak.v2
import=common/keycloak
styles=css/styles.css css/homelab.css
