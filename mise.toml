# The toolchain for this repo, in one place.
#
# The dev container, the git hooks and CI all install from here. Renovate
# keeps these pins current (mise manager).

[tools]
# prek builds the rest of the hook toolchain (yamlfmt, gitleaks) into its own
# cached envs.
python = "3.15.2"
prek = "0.5.10"

# actionlint shells out to shellcheck for `run:` blocks.
actionlint = "1.7.12"
shellcheck = "0.11.0"

# `make scan` locally, image scan and signature in CI.
trivy = "0.76.2"
cosign = "3.1.4"
